name: k-docker

services:
  k-licence-db:
    image: mariadb:12.3.3
    restart: unless-stopped
    environment:
      MARIADB_DATABASE: k_licence
      MYSQL_ALLOW_EMPTY_PASSWORD: "yes"
    ports:
      - "${K_LICENCE_DB_PORT:-3308}:3306"
    volumes:
      - k-licence-data:/var/lib/mysql
      - ./containers/k-licence-db/licence_db.cnf:/etc/mysql/conf.d/licence_db.cnf:ro
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      start_period: 30s
      interval: 5s
      timeout: 5s
      retries: 12

volumes:
  k-licence-data:
