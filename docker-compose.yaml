name: k-docker

services:
  k-local:
    image: nginx:1.30.6
    restart: unless-stopped
    network_mode: host
    volumes:
      - ./containers/k-local/conf.d:/etc/nginx/conf.d:ro
      - ./containers/k-local/tls:/etc/nginx/tls:ro
      - ${K_FAKTURE_PATH:-../k-fakture}:/srv/k-fakture:ro
      - ${K_AUTH_PATH:-../kancelarko}:/srv/k-auth:ro

  k-auth:
    build:
      context: ${K_AUTH_PATH:-../kancelarko}
      dockerfile: ../k-docker/containers/k-auth/image/Dockerfile
    restart: unless-stopped
    ports:
      - "${K_AUTH_PORT:-9083}:9000"
    volumes:
      - ${K_AUTH_PATH:-../kancelarko}:/var/www/html
      - ./containers/k-auth/php.ini:/usr/local/etc/php/conf.d/zz-k-auth.ini:ro
    environment:
      DB_HOST: k-master-db
      DB_PORT: "3306"
      REDIS_HOST: k-redis
      REDIS_PORT: "6379"
      TENANT_DB_HOST_MAP: ""
    depends_on:
      k-master-db:
        condition: service_healthy
      k-license-1-db:
        condition: service_healthy
      k-license-2-db:
        condition: service_healthy
      k-redis:
        condition: service_started

  k-auth-worker:
    build:
      context: ${K_AUTH_PATH:-../kancelarko}
      dockerfile: ../k-docker/containers/k-auth/image/Dockerfile
    restart: unless-stopped
    command: ["php", "artisan", "queue:work", "--sleep=1", "--max-time=3600"]
    volumes:
      - ${K_AUTH_PATH:-../kancelarko}:/var/www/html
      - ./containers/k-auth/php.ini:/usr/local/etc/php/conf.d/zz-k-auth.ini:ro
    environment:
      DB_HOST: k-master-db
      DB_PORT: "3306"
      REDIS_HOST: k-redis
      REDIS_PORT: "6379"
      TENANT_DB_HOST_MAP: ""
    extra_hosts:
      - "k-fakture.local:host-gateway"
      - "k-gateway.local:host-gateway"
    depends_on:
      k-auth:
        condition: service_started
      k-redis:
        condition: service_started

  k-fakture:
    build:
      context: ${K_FAKTURE_PATH:-../k-fakture}
      dockerfile: ../k-docker/containers/k-fakture/image/Dockerfile
      additional_contexts:
        gateway-client: ${K_GATEWAY_CLIENT_PATH:-../k-gateway-client}
    restart: unless-stopped
    ports:
      - "127.0.0.1:${K_FAKTURE_PORT:-9082}:9000"
    volumes:
      - ${K_FAKTURE_PATH:-../k-fakture}:/var/www/html
      - ./containers/k-fakture/php.ini:/usr/local/etc/php/conf.d/zz-k-fakture.ini:ro
    environment:
      GATEWAY_JWKS_URL: http://k-gateway:9090/.well-known/jwks.json
      GATEWAY_ISSUER: ${K_AUTH_ISSUER:-http://auth.kancelarko.local}
      GATEWAY_INTERNAL_URL: http://k-gateway:9090
    depends_on:
      - k-invoice-db
      - k-redis

  k-gateway:
    build:
      context: ./containers/k-gateway/image
    restart: unless-stopped
    ports:
      - "${K_GATEWAY_PORT:-9090}:9090"
    volumes:
      - ${K_GATEWAY_PATH:-../k-gateway}:/app
      - k-gateway-gradle:/home/app/.gradle
    environment:
      - REDIS_HOST=k-redis
      - K_GATEWAY_CLIENT_SECRET=${K_GATEWAY_CLIENT_SECRET:?postavi K_GATEWAY_CLIENT_SECRET u .env}
      - K_GATEWAY_PUBLIC_URL=${K_GATEWAY_PUBLIC_URL:-http://gateway.kancelarko.local}
      - K_FAKTURE_URI=http://host.docker.internal:9180
    extra_hosts:
      - auth.kancelarko.local:host-gateway
      - host.docker.internal:host-gateway
    depends_on:
      - k-redis

  k-invoice-db:
    build:
      context: ./containers/k-invoice-db/image
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${K_INVOICE_DB_DATABASE:-invoice}
      POSTGRES_USER: ${K_INVOICE_DB_USERNAME:-root}
      POSTGRES_PASSWORD: ${K_INVOICE_DB_PASSWORD:-}
      POSTGRES_HOST_AUTH_METHOD: trust
    ports:
      - "${K_INVOICE_DB_PORT:-5432}:5432"
    volumes:
      - k-invoice-db-data:/var/lib/postgresql

  k-master-db:
    image: mariadb:12.3.3
    restart: unless-stopped
    environment:
      MARIADB_DATABASE: office_master
      MYSQL_ALLOW_EMPTY_PASSWORD: "yes"
    ports:
      - "${K_MASTER_DB_PORT:-3306}:3306"
    volumes:
      - k-master-db-data:/var/lib/mysql
      - ./containers/k-master-db/master_db.cnf:/etc/mysql/conf.d/master_db.cnf:ro
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      start_period: 30s
      interval: 5s
      timeout: 5s
      retries: 12

  k-license-1-db:
    image: mariadb:12.3.3
    restart: unless-stopped
    environment:
      MYSQL_ALLOW_EMPTY_PASSWORD: "yes"
    ports:
      - "${K_LICENSE_1_DB_PORT:-3308}:3306"
    volumes:
      - k-license-1-db-data:/var/lib/mysql
      - ./containers/k-license-db/license_db.cnf:/etc/mysql/conf.d/license_db.cnf:ro
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      start_period: 30s
      interval: 5s
      timeout: 5s
      retries: 12

  k-license-2-db:
    image: mariadb:12.3.3
    restart: unless-stopped
    environment:
      MYSQL_ALLOW_EMPTY_PASSWORD: "yes"
    ports:
      - "${K_LICENSE_2_DB_PORT:-3309}:3306"
    volumes:
      - k-license-2-db-data:/var/lib/mysql
      - ./containers/k-license-db/license_db.cnf:/etc/mysql/conf.d/license_db.cnf:ro
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      start_period: 30s
      interval: 5s
      timeout: 5s
      retries: 12

  k-redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes", "--maxmemory-policy", "noeviction"]
    ports:
      - "${K_REDIS_PORT:-6379}:6379"
    volumes:
      - k-redis-data:/data

volumes:
  k-invoice-db-data:
  k-master-db-data:
  k-license-1-db-data:
  k-license-2-db-data:
  k-redis-data:
  k-gateway-gradle:
