; Custom PHP overrides applied on top of the base php:8.5 defaults.
; Copied into /usr/local/etc/php/conf.d/ so it affects both the CLI
; (artisan, composer, PHPStan) and the Apache SAPI.

; Default CLI limit of 128M is too low for Larastan/PHPStan, which boots the
; whole Laravel app to resolve Eloquent/container magic.
memory_limit = 1G

; --- Upload -------------------------------------------------------------------
; Forma memoranduma šalje sve slike (zaglavlja, podnožja, pečati, potpisi) u
; jednom zahtevu. Sa podrazumevanih 2M/8M PHP odbaci ceo POST pre Laravel
; validacije (PostTooLargeException), pa korisnik ne dobije grešku na polju.
; Limit po fajlu i tipovi ostaju u config/uploads.php; ovo je samo plafon.
upload_max_filesize = 32M
post_max_size = 64M
max_file_uploads = 50
