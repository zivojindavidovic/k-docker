# k-fakture je iza k-gateway-a na fakture.kancelarko.local (kancelarko-apps.conf).
server {
    listen 80;
    # HTTPS (443) samo kad postoji lokalni sertifikat: task tls-init.
    include /etc/nginx/tls/*.conf;
    server_name k-fakture.local;

    return 301 $scheme://fakture.kancelarko.local$request_uri;
}

# Interni ulaz za k-gateway (K_FAKTURE_URI=http://host.docker.internal:9180). Prepoznaje
# se po portu, ne po imenu: gateway salje Host javnog domena (fakture.kancelarko.local),
# koji bi na portu 80 ponovo otisao gateway-u. Dozvoljen samo iz Docker mreza, da
# k-fakture ne bude dostupan mimo gateway-a.
server {
    listen 9180;
    server_name _;
    root /srv/k-fakture/public;
    index index.php;
    charset utf-8;

    allow 127.0.0.1;
    allow 172.16.0.0/12;
    deny all;

    client_max_body_size 64m;

    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    location = /favicon.ico { access_log off; log_not_found off; }
    location = /robots.txt  { access_log off; log_not_found off; }

    error_page 404 /index.php;

    location ~ ^/index\.php(/|$) {
        include fastcgi_params;
        fastcgi_pass 127.0.0.1:9082;
        fastcgi_param SCRIPT_FILENAME /var/www/html/public$fastcgi_script_name;
        fastcgi_param DOCUMENT_ROOT /var/www/html/public;
        fastcgi_hide_header X-Powered-By;
    }

    location ~ \.php$ {
        return 404;
    }

    location ~ /\.(?!well-known).* {
        deny all;
    }
}
