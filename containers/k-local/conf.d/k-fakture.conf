# k-fakture je iza k-gateway-a na fakture.kancelarko.local (kancelarko-apps.conf).
server {
    listen 80;
    # HTTPS (443) samo kad postoji lokalni sertifikat: task tls.
    include /etc/nginx/tls/*.conf;
    server_name k-fakture.local;

    return 301 $scheme://fakture.kancelarko.local$request_uri;
}

# Interni ulaz za k-gateway (K_FAKTURE_URI=http://k-local:9180). Prepoznaje se po portu,
# ne po imenu: gateway salje Host javnog domena (fakture.kancelarko.local), koji bi na
# portu 80 ponovo otisao gateway-u. Port 9180 se ne objavljuje, pa je dostupan samo iz
# Docker mreze i k-fakture nije dostupan mimo gateway-a.
server {
    listen 9180;
    server_name _;
    root /srv/k-fakture/public;
    index index.php;
    charset utf-8;

    client_max_body_size 64m;

    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    location = /favicon.ico { access_log off; log_not_found off; }
    location = /robots.txt  { access_log off; log_not_found off; }

    error_page 404 /index.php;

    location ~ ^/index\.php(/|$) {
        include fastcgi_params;
        fastcgi_param HTTPS $forwarded_https if_not_empty;
        set $k_fakture k-fakture:9000;
        fastcgi_pass $k_fakture;
        fastcgi_param SCRIPT_FILENAME /var/www/html/public$fastcgi_script_name;
        fastcgi_param DOCUMENT_ROOT /var/www/html/public;
        fastcgi_hide_header X-Powered-By;
    }

    location ~ \.php$ {
        return 404;
    }

    location ~ /\.(?!well-known).* {
        deny all;
    }
}
