# k-fakture.local -> PHP-FPM kontejner k-fakture (FastCGI na 127.0.0.1:9082,
# port iz K_FAKTURE_PORT). Statiku nginx servira sam iz koda projekta,
# mount-ovanog read-only na /srv/k-fakture (servis k-local). U FPM kontejneru
# isti kod je na /var/www/html, zato SCRIPT_FILENAME koristi tu putanju.
server {
    listen 80;
    server_name k-fakture.local;
    root /srv/k-fakture/public;
    index index.php;
    charset utf-8;

    # Uskladjeno sa post_max_size u containers/k-fakture/php.ini.
    client_max_body_size 64m;

    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    location = /favicon.ico { access_log off; log_not_found off; }
    location = /robots.txt  { access_log off; log_not_found off; }

    error_page 404 /index.php;

    location ~ ^/index\.php(/|$) {
        include fastcgi_params;
        fastcgi_pass 127.0.0.1:9082;
        fastcgi_param SCRIPT_FILENAME /var/www/html/public$fastcgi_script_name;
        fastcgi_param DOCUMENT_ROOT /var/www/html/public;
        fastcgi_hide_header X-Powered-By;
    }

    # Nijedan drugi .php fajl se ne izvrsava.
    location ~ \.php$ {
        return 404;
    }

    location ~ /\.(?!well-known).* {
        deny all;
    }
}
