# Aplikacije iza k-gateway-a: ceo sajt ide kroz gateway (prijava, tokeni, rutiranje
# po hostu). Novu aplikaciju dodati u server_name i u rute gateway-a.
# gateway.kancelarko.local: povratak sa prijave/odjave na k-auth-u.
server {
    listen 80;
    # HTTPS (443) samo kad postoji lokalni sertifikat: task tls-init.
    include /etc/nginx/tls/*.conf;
    server_name gateway.kancelarko.local fakture.kancelarko.local;

    client_max_body_size 64m;

    location / {
        proxy_pass http://127.0.0.1:9090;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
