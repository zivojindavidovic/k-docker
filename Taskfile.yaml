version: '3'

tasks:
  projects-init:
    desc: Prikazi listu projekata, kloniraj odabrane (HTTPS) pored k-docker i upisi lokalne domene u hosts
    dir: '{{.TASKFILE_DIR}}'
    interactive: true
    cmds:
      - bash scripts/projects-init.sh {{.CLI_ARGS}}

  services:
    desc: Izaberi koji servisi rade; oznaceni se podizu, odznaceni se zaustavljaju, a sa argumentima se samo podizu navedeni
    dir: '{{.TASKFILE_DIR}}'
    interactive: true
    cmds:
      - bash scripts/services.sh {{.CLI_ARGS}}
