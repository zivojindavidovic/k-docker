version: '3'

tasks:
  projects-init:
    desc: Prikazi listu projekata, kloniraj odabrane (HTTPS) pored k-docker i upisi lokalne domene u hosts
    dir: '{{.TASKFILE_DIR}}'
    interactive: true
    cmds:
      - bash scripts/projects-init.sh {{.CLI_ARGS}}

  services:
    desc: Izaberi koji servisi rade; oznaceni se podizu, odznaceni se zaustavljaju, a sa argumentima se samo podizu navedeni
    dir: '{{.TASKFILE_DIR}}'
    interactive: true
    cmds:
      - bash scripts/services.sh {{.CLI_ARGS}}

  db-seed:
    desc: Napuni office_master i license baze iz dump-ova (K_DB_DUMPS_PATH) i dodaj test korisnike; --force ponovo uvozi, --local samo test podaci
    dir: '{{.TASKFILE_DIR}}'
    cmds:
      - bash scripts/db-seed.sh {{.CLI_ARGS}}

  tls-init:
    desc: Lokalni HTTPS za *.local domene (mkcert sertifikat, nginx 443); bez ovoga radi samo HTTP
    dir: '{{.TASKFILE_DIR}}'
    cmds:
      - bash scripts/tls-init.sh
