version: '3'

tasks:
  projects:
    desc: Prikazi projekte i da li su klonirani, kloniraj odabrane (k-auth i k-gateway su obavezni) i upisi lokalne domene u hosts
    dir: '{{.TASKFILE_DIR}}'
    interactive: true
    cmds:
      - bash scripts/projects.sh {{.CLI_ARGS}}

  services:
    desc: Izaberi koji servisi rade; oznaceni se podizu, odznaceni se zaustavljaju, a sa argumentima se samo podizu navedeni
    dir: '{{.TASKFILE_DIR}}'
    interactive: true
    cmds:
      - bash scripts/services.sh {{.CLI_ARGS}}

  hosts:
    desc: Upisi sve lokalne domene (server_name iz containers/k-local/conf.d) u /etc/hosts, a na WSL-u i u Windows hosts
    dir: '{{.TASKFILE_DIR}}'
    interactive: true
    cmds:
      - bash scripts/hosts.sh

  db-init:
    desc: Napuni office_master i license baze iz dump-ova u scripts/seed i dodaj test korisnike; --force ponovo uvozi, --local samo test podaci
    dir: '{{.TASKFILE_DIR}}'
    cmds:
      - bash scripts/db-init.sh {{.CLI_ARGS}}

  tls:
    desc: Lokalni HTTPS za sve domene k-local-a (mkcert CA i sertifikat, HTTP se preusmerava na HTTPS); task services ga pokrece sam kad treba
    dir: '{{.TASKFILE_DIR}}'
    interactive: true
    cmds:
      - bash scripts/tls.sh
